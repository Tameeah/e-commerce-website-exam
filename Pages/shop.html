<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop All | That's T</title>
    <link rel="stylesheet" href="../CSS/shopall.css" />

    <!-- GSAP --> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  
</head>
<body>

    <!-- Page Transition Curtains -->
    <div class="curtain curtain-left"></div>
    <div class="curtain curtain-right"></div>

    <!-- Cursor dash line Element -->
    <div class="cursor-dash"></div> 

    <!-- Navigation Bar -->
    <header class="navbar">
        <button class="mobile-menu-toggle" id="mobile-menu-btn" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
        <a href="index.html" class="logo-container">
            <img src="../Assets/images/Logo.png" alt="Logo" alt="Brand Logo" class="brand-logo" />
        </a>

        <nav class="nav-links">
            <div class="dropdown-wrap" id="shop-dropdown-wrap">
                <a href="shop.html" class="nav-item shop-link">shop all<span class="nav-underline"></span></a>
                <div class="dropdown-menu">
                    <a href="shop.html?category=tops">tops</a>
                    <a href="shop.html?category=skirts">skirts</a>
                    <a href="shop.html?category=dresses">dresses</a>
                </div>
            </div>

            <a href="about.html" class="nav-item nav-link-underline">about - That's T<span class="nav-underline"></span></a>
            <a href="contact.html" class="nav-item nav-link-underline"> contact<span class="nav-underline"></span></a>
        </nav>

        <div class="nav-actions">
            <!--search input-->
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search pieces..." class="search-input" />
                <button class="icon-btn" id="search-toggle-btn" aria-label="Search">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>

             <button class="icon-btn bag-icon-btn" id="bag-toggle-btn" aria-label="Bag">
                <svg class="icon" viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" d="M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm6 16H6V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h4v2c0 .55.45 1 1 1s1-.45 1-1V8h2v12z"/></svg>
                <span class="bag-badge" id="bag-badge">0</span>
            </button>
        </div>
    </header>

    <main class="shop-main">
        <!--Page heading and categorgies-->
        <div class="shop-header-section">
            <div class="shop-header-row">
                <h1 class="page-main-heading">Our Pieces</h1>

                <div class="shop-controls-bar">
                    <button class="cat-tab active" data-category="all">all</button>
                    <button class="cat-tab" data-category="tops">tops</button>
                    <button class="cat-tab" data-category="skirts">skirts</button>
                    <button class="cat-tab" data-category="dresses">dresses</button>
                </div>
            </div>

            <div class="shop-filter-row">
                <div class="filter-dropdown-container">
                    <button class="filter-toggle-btn" id="filter-toggle-btn" aria-label="Filter">
                        filter 
                        <svg class="filter-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                        </svg>
                    </button>
                    <div class="filter-dropdown-menu" id="filter-dropdown-menu">
                        <div class="filter-option" data-sort="featured">featured</div>
                        <div class="filter-option" data-sort="low-high">Price: Low to High</div>
                        <div class="filter-option" data-sort="high-low">Price: High to Low</div>
                    </div>
                    <select id="sort-select" style="display: none;">
                        <option value="featured">featured</option>
                        <option value="low-high">Price: Low to High</option>
                        <option value="high-low">Price: High to Low</option>
                    </select>
                </div>
            </div>
        </div>

        <!--products in a grid display-->
        <section class="shop-grid-section">
            <div id="shop-products-grid" class="shop-products-grid">
                <!--js and API fectch data for products-->
            </div>
        </section>

    </main>

    <!-- Side Cart Drawer-->

    <div class="cart-overlay" id="cart-overlay"></div>

    <div class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <button class="cart-close-btn" id="cart-close-btn" aria-label="Close cart">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
            <h2 class="cart-title">Your bag</h2>
        </div>

        <div class="cart-body" id="cart-body">
            <!--JS and API injected-->
        </div>

        <div class="cart-footer" id="cart-footer">
            <!--JS injected-->
        </div>
    </div>

    <!--transition JS global-->
    <script src="../JS/transition.js"></script>
    <script src="../JS/shopall.js"></script>

    
</body>
</html>
