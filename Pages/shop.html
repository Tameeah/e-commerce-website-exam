<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop All | That's T</title>
    <link rel="stylesheet" href="../CSS/shopall.css" />

    <!-- GSAP scripts here --> 
     <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

</head>
<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <a href="index.html" class="logo-container">
            <img src="../Assets/images/Logo.png" alt="Logo" alt="Brand Logo" class="brand-logo" />
        </a>

        <nav class="nav-links">
            <a href="shop.html"class="active-nav"> shop all</a>
            <a href="about.html"> that's t</a>
            <a href="contact.html"> contact</a>
        </nav>

        <div class="nav-actions">
            <!--search input-->
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search pieces..." class="search-input" />
                <button class="icon-btn" id="search-toggle-btn" aria-label="Search">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>

                </button>
            </div>

            <button class="icon-btn" aria-label="Bag">
                <svg class="icon" viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="2" d="M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm6 16H6V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h4v2c0 .55.45 1 1 1s1-.45 1-1V8h2v12z"/></svg>
            </button>
        </div>
    </header>

    <main class="shop-main">
        <!--Page heading and categorgies-->
        <div class="shop-header-section">
            <h1 class="page-main-heading">Our Pieces</h1>

            <div class="shop-controls-bar"></div>

                 <div class="shop-controls-bar">
                    <button class="cat-tab active" data-category="all">all</button>
                    <button class="cat-tab" data-category="tops">tops</button>
                    <button class="cat-tab" data-category="skirts">skirts</button>
                    <button class="cat-tab" data-category="dresses">dresses</button>
                </div>

            <!--Filter-->
                <div class="filter-dropdown-wrap">
                    <label for="sort-select" class="filter-label">filter</label>
                    <select id="sort-select" class="sort-select">
                        <option value="featured">featured</option>
                        <option value="low-high">Price: Low to High</option>
                        <option value="high-low">Price: High to Low</option>
                    </select>
                </div>
            </div>
        </div>

        <!--products in a grid display-->
        <section class="shop-grid-section">
            <div id="shop-products-grid" class="shop-products-grid">
                <!--js and API fectch data for products-->
            </div>
        </section>

    </main>

    <script src="../JS/shopall.js"></script>
    
</body>
</html>
